<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Secure Checker</title>
<style>
  :root { color-scheme: light dark; }
  body { width: 380px; max-height: 560px; overflow-y: auto; margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0b0f14; color: #e5e7eb; }
  header { padding: 0.9rem 1rem 0.6rem; border-bottom: 1px solid #27303f; }
  header h1 { font-size: 1rem; margin: 0 0 0.2rem; }
  header .url { font-size: 0.75rem; color: #9ca3af; word-break: break-all; }
  .actions { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; }
  button { flex: 1; padding: 0.5rem 0.6rem; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #e5e7eb; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
  button:hover { background: #334155; }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { padding: 0 1rem; font-size: 0.8rem; color: #9ca3af; min-height: 1rem; }
  #summary { display: flex; gap: 0.4rem; flex-wrap: wrap; padding: 0.5rem 1rem; }
  .pill { font-size: 0.7rem; font-weight: 700; color: #fff; padding: 0.15rem 0.5rem; border-radius: 999px; }
  #findings { padding: 0.25rem 1rem 1rem; }
  .finding { border-left: 4px solid #555; border-radius: 6px; background: rgba(255,255,255,0.04); padding: 0.55rem 0.7rem; margin-bottom: 0.5rem; }
  .finding .title { font-weight: 700; font-size: 0.85rem; margin-bottom: 0.15rem; }
  .finding .desc { font-size: 0.78rem; color: #cbd5e1; margin-bottom: 0.3rem; }
  .finding .fix { font-size: 0.78rem; color: #34d399; }
  .empty { text-align: center; color: #10b981; padding: 1.5rem 1rem; font-size: 0.85rem; }
</style>
</head>
<body>
  <header>
    <h1>Secure Checker</h1>
    <div class="url" id="targetUrl">-</div>
  </header>
  <div class="actions">
    <button id="quickScanBtn">Quick Scan</button>
    <button id="detailedScanBtn">Detailed Scan</button>
  </div>
  <div id="status"></div>
  <div id="summary"></div>
  <div id="findings"></div>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
